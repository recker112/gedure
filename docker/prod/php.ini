; Configuración de PHP de producción (imagen Dockerfile.prod).
; La imagen de FrankenPHP no carga ningún php.ini base: rige lo de aquí y los
; valores compilados por defecto.

; ── Memoria y subidas ─────────────────────────────────────────────────────
; 64M: mismo límite que tenía el stack anterior (docker/php/upload.ini).
; memory_limit holgado para dompdf, maatwebsite/excel e intervention/image (GD
; descomprime la imagen entera en memoria).
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; ── Errores y hardening ──────────────────────────────────────────────────
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
; Sin E_DEPRECATED: Laravel 10 y sus dependencias disparan cientos de avisos
; de PHP 8.4/8.5 (nullable implícito, etc.) al compilar cada archivo, que en CLI
; (sin opcache) inundarían los logs en cada comando. Esto solo cubre lo que se
; compila ANTES de que Laravel arranque: su HandleExceptions hace
; error_reporting(-1), y algunos avisos de compilación posteriores aún salen
; por stderr como "PHP Deprecated" (en CLI en cada comando; en web solo la
; primera vez, luego opcache). Es ruido, no errores; desaparece con Laravel 11+.
error_reporting = E_ALL & ~E_DEPRECATED

; ── Opcache ───────────────────────────────────────────────────────────────
; El código es inmutable dentro de la imagen: no hace falta revalidar mtimes.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
