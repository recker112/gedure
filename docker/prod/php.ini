; Configuración de PHP de producción (imagen Dockerfile.prod).
; La imagen de FrankenPHP no carga ningún php.ini base: rige lo de aquí y los
; valores compilados por defecto.

; ── Memoria y subidas ─────────────────────────────────────────────────────
; 64M de subida: mismo límite que tenía el stack anterior. memory_limit
; holgado; bájalo si la app no procesa archivos grandes en memoria.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; ── Errores y hardening ──────────────────────────────────────────────────
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; ── Opcache ───────────────────────────────────────────────────────────────
; El código es inmutable dentro de la imagen: no hace falta revalidar mtimes.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
