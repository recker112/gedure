; PHP de desarrollo (Dockerfile.dev). Mismos límites que producción
; (docker/prod/php.ini) pero con errores visibles y sin cache de mtimes.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

expose_php = Off
display_errors = On
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
