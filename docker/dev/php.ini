; PHP de desarrollo (Dockerfile.dev). Mismos límites que producción
; (docker/prod/php.ini) pero con errores visibles y sin cache de mtimes.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

expose_php = Off
display_errors = On
log_errors = On
error_log = /dev/stderr
; Sin E_DEPRECATED (ver docker/prod/php.ini): con display_errors=On los avisos
; de PHP 8.5 en Laravel 10 saldrían por pantalla en cada `php artisan`. Algunos
; aún aparecen como "PHP Deprecated" en los logs del contenedor: es ruido.
error_reporting = E_ALL & ~E_DEPRECATED

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
