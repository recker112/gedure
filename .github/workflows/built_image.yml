name: Build and Push to GHCR

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: build-image
      # false a propósito: cada tag es una versión que debe quedar publicada.
      # Cancelar un build a medias por otro tag dejaría esa versión sin imagen.
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            # El tag de la imagen replica el tag de git tal cual (v5.5.0), para
            # que la versión que se fija en vps-candelaria coincida con la
            # release de GitHub. `type=ref` y no `type=semver`: si un tag no
            # parsea como semver, `type=semver` lo omite y la imagen quedaría
            # publicada solo como `latest`, sin versión fijable para rollback.
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo valores públicos: los build-args quedan en el historial de la
          # imagen. Secretos (APP_KEY, DB_PASSWORD...) van como variables de
          # entorno del stack en el VPS.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
