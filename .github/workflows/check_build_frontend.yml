name: Build Frontend

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/check_build_frontend.yml"

permissions:
  contents: read

jobs:
  build:
    name: Construir el frontend con Vite
    runs-on: ubuntu-latest
    steps:
      # El checkout incluye backend/: el plugin laravel-output escribe el
      # build en backend/public y genera backend/resources/views/app.blade.php.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      # mkcert solo aplica al dev server; no se ejecuta en `vite build`.
      - name: Construir proyecto Vite
        working-directory: ./frontend
        run: npm run build
